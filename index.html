<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本隨行小卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF2;
      --card-bg: #FFFFFF;
      --primary-yellow: #FFE066;
      --soft-yellow: #FFF2B2;
      --soft-pink: #FFD1DC;
      --accent-orange: #FF9B42;
      --text-color: #5A4A42;
      --light-text: #9E8E85;
      --border-color: #F7E7C4;
      --shadow: 0 10px 25px rgba(230, 190, 100, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .trip-counter-badge {
      display: inline-block;
      background: var(--soft-yellow);
      color: var(--accent-orange);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(240, 220, 180, 0.4);
    }

    .section-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .city-select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid var(--border-color);
      background: var(--bg-color);
      font-size: 0.9rem;
      color: var(--text-color);
      font-weight: 700;
      outline: none;
      margin-bottom: 10px;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .weather-icon {
      font-size: 2.2rem;
    }

    .temp-display {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-orange);
    }

    .outfit-box {
      flex: 1;
      background: var(--bg-color);
      border-radius: 14px;
      padding: 8px 12px;
      border: 1.5px dashed var(--border-color);
      font-size: 0.8rem;
      color: var(--text-color);
      line-height: 1.4;
      font-weight: 500;
    }

    .outfit-title {
      font-weight: 700;
      color: var(--accent-orange);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .currency-header {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rate-tag {
      font-size: 0.75rem;
      color: var(--light-text);
      font-weight: 500;
    }

    .currency-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .currency-input-group label {
      font-size: 0.95rem;
      font-weight: 900;
      width: 55px;
      color: var(--accent-orange);
    }

    .currency-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-color);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-color);
      outline: none;
    }

    .card-container {
      width: 100%;
      max-width: 360px;
      height: 380px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
      border: 3.5px solid var(--border-color);
    }

    .card-front {
      background: linear-gradient(135deg, #FFFFFF 0%, var(--soft-yellow) 100%);
    }

    .card-front .character-img {
      width: 95px;
      height: 95px;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    .card-front p {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text-color);
    }

    .card-front span {
      font-size: 0.78rem;
      color: var(--light-text);
      margin-top: 6px;
      background: #FFF;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .card-back {
      background: var(--card-bg);
      transform: rotateY(180deg);
      justify-content: space-between;
    }

    .quote-content {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-color);
      margin: auto 0;
      font-weight: 700;
    }

    .quote-author {
      font-size: 0.82rem;
      color: var(--accent-orange);
      font-weight: 900;
      background: var(--soft-yellow);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .action-btn {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(135deg, var(--primary-yellow) 0%, #FFD000 100%);
      color: var(--text-color);
      border: 2.5px solid var(--border-color);
      padding: 12px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 210, 0, 0.3);
      transition: transform 0.15s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 日本隨行小卡 ✨</h1>
    <div class="trip-counter-badge" id="tripCounter">計算旅程天數中...</div>
  </header>

  <!-- 天氣與穿衣提醒 -->
  <div class="section-card">
    <select class="city-select" id="citySelect" onchange="fetchWeather()">
      <option value="nagoya">🏯 名古屋 (Nagoya) 即時天氣</option>
      <option value="fukuoka">🍜 福岡 (Fukuoka) 即時天氣</option>
    </select>
    
    <div class="weather-row">
      <div class="weather-main">
        <div class="weather-icon" id="weatherIcon">🌤️</div>
        <div class="temp-display" id="tempDisplay">--°C</div>
      </div>
      
      <div class="outfit-box">
        <div class="outfit-title"><span>👔</span> 穿搭提醒</div>
        <div id="outfitText">連線查詢最新天氣與穿搭建議...</div>
      </div>
    </div>
  </div>

  <!-- 💴 日幣匯率計算器 -->
  <div class="section-card">
    <div class="currency-header">
      <span>💴 日幣匯率計算器</span>
      <span class="rate-tag" id="rateText">參考匯率約 0.215</span>
    </div>
    
    <div class="currency-input-group">
      <label for="jpyInput">日幣 ¥</label>
      <input type="number" id="jpyInput" class="currency-input" placeholder="輸入日幣金額" oninput="convertCurrency('jpy')">
    </div>
    
    <div class="currency-input-group">
      <label for="twdInput">台幣 $</label>
      <input type="number" id="twdInput" class="currency-input" placeholder="換算台幣金額" oninput="convertCurrency('twd')">
    </div>
  </div>

  <!-- 抽卡卡片 -->
  <div class="card-container" id="cardContainer" onclick="handleDraw()">
    <div class="card" id="quoteCard">
      <div class="card-face card-front">
        <svg class="character-img" viewBox="0 0 100 100">
          <circle cx="50" cy="55" r="32" fill="#FFE066"/>
          <circle cx="28" cy="30" r="12" fill="#FFE066"/>
          <circle cx="72" cy="30" r="12" fill="#FFE066"/>
          <circle cx="28" cy="30" r="7" fill="#FFF2B2"/>
          <circle cx="72" cy="30" r="7" fill="#FFF2B2"/>
          <circle cx="40" cy="52" r="3.5" fill="#5A4A42"/>
          <circle cx="60" cy="52" r="3.5" fill="#5A4A42"/>
          <ellipse cx="50" cy="58" rx="4" ry="3" fill="#5A4A42"/>
          <ellipse cx="33" cy="58" rx="5" ry="3" fill="#FFB7B2" opacity="0.7"/>
          <ellipse cx="67" cy="58" rx="5" ry="3" fill="#FFB7B2" opacity="0.7"/>
          <path d="M42 22 C35 15, 35 30, 42 26 Z" fill="#FFD1DC"/>
          <path d="M58 22 C65 15, 65 30, 58 26 Z" fill="#FFD1DC"/>
          <circle cx="50" cy="24" r="4" fill="#FF9B42"/>
        </svg>
        <p>點擊抽取今日幸運小語</p>
        <span>✨ 輕觸卡片翻面 ✨</span>
      </div>
      <div class="card-face card-back">
        <div class="quote-content" id="quoteText">點擊下方按鈕抽取第一張靈感卡片吧！</div>
        <div class="quote-author" id="quoteAuthor">—— 今日靈感</div>
      </div>
    </div>
  </div>

  <button class="action-btn" id="drawBtn" onclick="handleDraw()">再抽一張 🎲</button>

  <script>
    var currentRate = 0.215;
    var isFlipping = false;

    var quotes = [
      { text: "發現的真正旅程，不在於尋找新風景，而在於擁有新眼光。", author: "—— 馬塞爾·普魯斯特" },
      { text: "世界不缺乏美，缺乏的是發現美的眼睛。", author: "—— 奧古斯特·羅丹" },
      { text: "我們看到的不是事物的本質，而是我們自己的本質。", author: "—— 阿娜伊斯·寧" },
      { text: "如果不曾迷失過，你就永遠無法發現新的大陸。", author: "—— 安德烈·紀德" },
      { text: "地平線不過是我們視覺的極限，而非世界的邊界。", author: "—— 威廉·布萊克" },
      { text: "最偉大的發現，往往隱藏在最不起眼的細節之中。", author: "—— 艾薩克·牛頓" },
      { text: "當你改變看事物的方式，你所看的事物也會隨之改變。", author: "—— 韋恩·戴爾" },
      { text: "世界是一本書，不旅行的人只讀了其中的一頁。", author: "—— 聖奧古斯丁" },
      { text: "大自然從不著急，然而萬物皆隨之完成。", author: "—— 老子" },
      { text: "時間是世界上最長又最短、最快又最慢的東西。", author: "—— 伏爾泰" },
      { text: "生命就像騎自行車，想保持平衡，你就必須不斷前進。", author: "—— 阿爾伯特·愛因斯坦" },
      { text: "一花一世界，一葉一菩提。", author: "—— 威廉·布萊克" },
      { text: "沒有什麼是永恆的，這正是萬物如此珍貴的原因。", author: "—— 岡倉天心" },
      { text: "春有百花秋有月，夏有涼風冬有雪；若無閒事掛心頭，便是人間好時節。", author: "—— 慧開禪師" },
      { text: "生活要麼是一場大膽的冒險，要麼什麼都不是。", author: "—— 海倫·凱勒" },
      { text: "最深的平靜，往往來自於接納現狀的那一刻。", author: "—— 馬可·奧理略" },
      { text: "當你學會與自己和平共處，世界也會對你溫柔。", author: "—— 蒙田" },
      { text: "一期一會。每一個瞬間都是不可複製的奇蹟。", author: "—— 千利休" },
      { text: "慢慢來，比較快。給自己一點時間，世界會慢慢溫柔起來。", author: "—— 塞內卡" }
    ];

    function updateTripCounter() {
      try {
        var now = new Date();
        var currentYear = now.getFullYear();
        var startDate = new Date(currentYear, 9, 26);
        var endDate = new Date(currentYear, 10, 12);
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var counterElem = document.getElementById('tripCounter');
        if (!counterElem) return;

        var diffTimeStart = startDate - today;
        var diffDaysStart = Math.ceil(diffTimeStart / (1000 * 60 * 60 * 24));

        if (diffDaysStart > 0) {
          counterElem.textContent = '距離 10/26 出發還有 ' + diffDaysStart + ' 天 ✈️';
        } else {
          var dayOfTrip = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;
          if (today <= endDate) {
            counterElem.textContent = '日本旅程第 Day ' + dayOfTrip + ' 天 🍁';
          } else {
            counterElem.textContent = '旅程圓滿結束 🌸';
          }
        }
      } catch(e) { console.log(e); }
    }

    function fetchExchangeRate() {
      try {
        fetch('https://open.er-api.com/v6/latest/JPY')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && data.rates && data.rates.TWD) {
              currentRate = data.rates.TWD;
              var rateElem = document.getElementById('rateText');
              if (rateElem) rateElem.textContent = '即時匯率約 ' + currentRate.toFixed(4);
            }
          })
          .catch(function(err) {
            var rateElem = document.getElementById('rateText');
            if (rateElem) rateElem.textContent = '參考匯率約 ' + currentRate;
          });
      } catch(e) { console.log(e); }
    }

    function convertCurrency(source) {
      try {
        var jpyInput = document.getElementById('jpyInput');
        var twdInput = document.getElementById('twdInput');
        if (!jpyInput || !twdInput) return;

        if (source === 'jpy') {
          var jpyVal = parseFloat(jpyInput.value);
          if (!isNaN(jpyVal)) {
            twdInput.value = Math.round(jpyVal * currentRate);
          } else {
            twdInput.value = '';
          }
        } else if (source === 'twd') {
          var twdVal = parseFloat(twdInput.value);
          if (!isNaN(twdVal)) {
            jpyInput.value = Math.round(twdVal / currentRate);
          } else {
            jpyInput.value = '';
          }
        }
      } catch(e) { console.log(e); }
    }

    function handleDraw() {
      try {
        var card = document.getElementById('quoteCard');
        if (!card || isFlipping) return;

        if (card.classList.contains('flipped')) {
          isFlipping = true;
          card.classList.remove('flipped');
          setTimeout(function() {
            showRandomQuote();
            isFlipping = false;
          }, 350);
        } else {
          showRandomQuote();
          card.classList.add('flipped');
        }
      } catch(e) { console.log(e); }
    }

    function showRandomQuote() {
      try {
        var quoteText = document.getElementById('quoteText');
        var quoteAuthor = document.getElementById('quoteAuthor');
        var randomIndex = Math.floor(Math.random() * quotes.length);
        var selected = quotes[randomIndex];
        
        if (quoteText && quoteAuthor) {
          quoteText.textContent = selected.text;
          quoteAuthor.textContent = selected.author;
        }
      } catch(e) { console.log(e); }
    }

    var cityCoords = {
      nagoya: { lat: 35.1815, lon: 136.9064, name: "名古屋" },
      fukuoka: { lat: 33.5902, lon: 130.4017, name: "福岡" }
    };

    function fetchWeather() {
      try {
        var citySelect = document.getElementById('citySelect');
        if (!citySelect) return;

        var cityKey = citySelect.value;
        var coords = cityCoords[cityKey];
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + coords.lat + '&longitude=' + coords.lon + '&current_weather=true';

        var tempDisplay = document.getElementById('tempDisplay');
        var outfitText = document.getElementById('outfitText');
        var weatherIcon = document.getElementById('weatherIcon');

        if (tempDisplay) tempDisplay.textContent = '讀取...';

        fetch(url)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var temp = Math.round(data.current_weather.temperature);
            var code = data.current_weather.weathercode;
            
            if (tempDisplay) tempDisplay.textContent = temp + '°C';
            
            var icon = '🌤️';
            if (code === 0) icon = '☀️';
            else if (code >= 1 && code <= 3) icon = '⛅';
            else if (code >= 51) icon = '🌧️';

            if (weatherIcon) weatherIcon.textContent = icon;

            var outfit = '';
            if (temp < 15) {
              outfit = '天氣偏涼，建議穿厚外套或刷毛上衣，圍巾備著更保暖！';
            } else if (temp >= 15 && temp <= 22) {
              outfit = '舒爽涼意，推薦「薄長袖 + 風衣/針織外套」洋蔥式穿搭。';
            } else {
              outfit = '氣溫舒適，穿薄長袖或短袖搭件輕便襯衫即可輕鬆出門！';
            }

            if (code >= 51) outfit += '（今天有雨，出門記得帶傘喔！）';

            if (outfitText) outfitText.textContent = outfit;
          })
          .catch(function(err) {
            if (tempDisplay) tempDisplay.textContent = '16°C';
            if (weatherIcon) weatherIcon.textContent = '🍁';
            if (outfitText) outfitText.textContent = '秋季早晚溫差大，建議「薄長袖 + 防風外套」洋蔥式搭法！';
          });
      } catch(e) { console.log(e); }
    }

    window.onload = function() {
      updateTripCounter();
      fetchWeather();
      fetchExchangeRate();
    };
  </script>
</body>
</html>
