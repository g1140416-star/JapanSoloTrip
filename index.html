<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本隨行小卡 - 隨行靈感與天氣</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF2; /* 奶油白底色 */
      --card-bg: #FFFFFF;
      --primary-yellow: #FFE066; /* 溫暖黃 */
      --soft-yellow: #FFF2B2; /* 淺奶油黃 */
      --soft-pink: #FFD1DC;
      --accent-orange: #FF9B42;
      --text-color: #5A4A42;
      --light-text: #9E8E85;
      --border-color: #F7E7C4;
      --shadow: 0 10px 25px rgba(230, 190, 100, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 14px 30px 14px;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    /* 旅程日期計算機條籤 */
    .trip-counter-badge {
      display: inline-block;
      background: var(--soft-yellow);
      color: var(--accent-orange);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(240, 220, 180, 0.4);
    }

    /* 天氣卡片 */
    .weather-section {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .city-select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid var(--border-color);
      background: var(--bg-color);
      font-size: 0.9rem;
      color: var(--text-color);
      font-weight: 700;
      outline: none;
      margin-bottom: 10px;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .weather-icon {
      font-size: 2.2rem;
    }

    .temp-display {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-orange);
    }

    .outfit-box {
      flex: 1;
      background: var(--bg-color);
      border-radius: 14px;
      padding: 8px 12px;
      border: 1.5px dashed var(--border-color);
      font-size: 0.8rem;
      color: var(--text-color);
      line-height: 1.4;
      font-weight: 500;
    }

    .outfit-title {
      font-weight: 700;
      color: var(--accent-orange);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 抽卡卡片 */
    .card-container {
      width: 100%;
      max-width: 360px;
      height: 380px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
      border: 3.5px solid var(--border-color);
    }

    .card-front {
      background: linear-gradient(135deg, #FFFFFF 0%, var(--soft-yellow) 100%);
    }

    .card-front .character-img {
      width: 95px;
      height: 95px;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    .card-front p {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text-color);
    }

    .card-front span {
      font-size: 0.78rem;
      color: var(--light-text);
      margin-top: 6px;
      background: #FFF;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .card-back {
      background: var(--card-bg);
      transform: rotateY(180deg);
      justify-content: space-between;
    }

    .quote-content {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-color);
      margin: auto 0;
      font-weight: 700;
    }

      color: var(--accent-orange);
      font-weight: 900;
      background: var(--soft-yellow);
